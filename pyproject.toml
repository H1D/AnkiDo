[project]
name = "ankido"
version = "0.2.0"
description = "Headless, multi-account HTTP API for AnkiWeb collections."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["anki", "ankiweb", "flashcards", "spaced-repetition", "api", "ankiconnect"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
dependencies = [
  "anki>=26.5",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=2.2,<3",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
ankido = "ankido.cli:main"

[project.urls]
Homepage = "https://github.com/H1D/AnkiDo"
Changelog = "https://github.com/H1D/AnkiDo/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-timeout>=2.3",
  "ruff>=0.8",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankido"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "W"]
ignore = ["RUF012", "N818", "B008", "UP042"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q"
markers = ["e2e: requires AnkiWeb test credentials (ANKIDO_E2E_ENV)"]

[tool.coverage.run]
source = ["ankido"]
branch = true
